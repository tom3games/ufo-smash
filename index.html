<head>

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="theme-color" content="#0b0818" />

  <link rel="apple-touch-icon" href="icon-192.png?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body>
  <div class="crt">
    <div id="app">
      <div id="stage">
        <canvas id="game" width="480" height="642"></canvas>

        <!-- ハンバーガーメニューボタン(ゲーム中のみ表示) -->
        <button id="menuBtn" class="menu-btn" aria-label="メニュー" aria-expanded="false" title="メニュー">
          <span></span><span></span><span></span>
        </button>

        <!-- ホーム画面 -->
        <div id="home" class="screen">
          <div class="home-inner">
            <h1>UFO SMASH!</h1>
            <p class="ranks-title">BEST 3</p>
            <ol id="homeRanks" class="ranks"></ol>
            <button id="startBtn">START</button>
          </div>
        </div>

        <!-- メニュー(あそびかた) -->
        <div id="menu" class="screen hidden">
          <div class="panel">
            <h2 id="howtoTitle">あそびかた</h2>
            <ul id="howtoList">
              <li>玉を<b>引いて離す</b>と発射（貫通）。</li>
              <li><b>UFO</b>を撃ち落として<b>人々</b>を守れ。</li>
              <li>全員やられたら<b>ゲームオーバー</b>。</li>
            </ul>
            <div class="menu-actions">
              <button id="resumeBtn">とじる</button>
              <button id="bgmBtn" class="btn-sm">BGM: ON</button>
              <button id="fsBtn" class="btn-sm">フルスクリーン</button>
              <button id="homeBtn" class="btn-sm">ホームへ</button>
            </div>
          </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameover" class="screen hidden">
          <section class="panel">
            <h2>GAME OVER</h2>
            <p id="newBest" class="new-best hidden">★ NEW BEST! ★</p>
            <p class="score-line">SCORE <span id="finalScore">0</span></p>
            <p class="ranks-title">BEST 3</p>
            <ol id="goRanks" class="ranks"></ol>
            <button id="retryBtn">RETRY</button>
            <div class="menu-actions">
              <button id="shareBtn" class="btn-sm btn-en">SHARE</button>
              <button id="toHomeBtn" class="btn-sm btn-en">HOME</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  <script>
  (function(){
    var opt={passive:false};
    ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
    document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
    var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,input,select,label,[onclick],.skinchip')))e.preventDefault();last=n},opt);
    document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
    window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
    window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
  })();
  (function(){
    var errs=[];
    window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
    window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
    setTimeout(function(){
      if(window.__jsUp) return;
      var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 8px 8px 8px;z-index:199;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px';
      d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
      document.body.appendChild(d);
    },15000);
  })();
  </script>
  <script src="tm.js?v=1" data-game="ufo-smash"></script>
  <script src="game.js?v=20"></script>
  <script src="support.js?v=1" data-again="retryBtn" data-lang="html" data-ja="宇宙食" data-en="some space food"></script>
</body>
</html>
